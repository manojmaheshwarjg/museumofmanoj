<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // An experience page is set up before the first paint, so the walk in never flashes up behind it.
    try {
      var saved = JSON.parse(localStorage.getItem('manoj-museum:v1') || '{}');
      if (saved.ticketPrinted && /^\/experience\/[a-z0-9-]+\/?$/.test(location.pathname)) document.documentElement.dataset.page = 'experience';
    } catch (e) {}
    // The walk in needs the 3D city, so its code starts downloading now, alongside everything else, instead of once
    // the app is running. A build writes the file names in (vite.config.js); an experience page doesn't need them.
    var city = '__CITY_CHUNKS__';
    if (Array.isArray(city) && document.documentElement.dataset.page !== 'experience' && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      city.forEach(function (href) { var link = document.createElement('link'); link.rel = 'modulepreload'; link.href = href; document.head.appendChild(link); });
    }
    // Page to page is a view transition. One that can't run (in a hidden tab, say) is skipped quietly, not thrown.
    var quiet = function (e) { if (e.viewTransition) { e.viewTransition.ready.catch(function () {}); e.viewTransition.finished.catch(function () {}); } };
    addEventListener('pageswap', quiet);
    addEventListener('pagereveal', quiet);
    // Arrived through the museum doors just now: this page starts as the light through them, and the stop rises up
    // into it once it's drawn (lib/entrance.js, main.js), so no page-to-page transition plays on top. A door left long
    // ago (the page change was stopped, say) doesn't count, and a stop that never gets drawn shows up anyway.
    try {
      var doors = Number(sessionStorage.getItem('manoj-museum:through-doors'));
      sessionStorage.removeItem('manoj-museum:through-doors');
      if (doors && Date.now() - doors < 15000 && /^\/experience\//.test(location.pathname)) {
        document.documentElement.dataset.arrive = 'doors';
        addEventListener('pagereveal', function (e) { if (e.viewTransition) e.viewTransition.skipTransition(); });
        window.__doorsTimer = setTimeout(function () { delete document.documentElement.dataset.arrive; }, 8000);
      }
    } catch (e) {}
  </script>

  <div class="loader" data-loader aria-hidden="true">
    <p class="loader__note"><span>Drawing 26th Avenue</span><span data-loader-pct>0%</span></p>
  </div>
  <script>
    // The loader: the night ground the city is drawn on, and how far along it is. It runs before any other script has
    // arrived; main.js reports progress through window.__loader and says when to lift it.
    (function () {
      var root = document.documentElement;
      var loader = document.querySelector('[data-loader]');
      if (root.dataset.page === 'experience') { loader.remove(); return; }
      history.scrollRestoration = 'manual';
      root.classList.add('is-loading');
      var pct = loader.querySelector('[data-loader-pct]');
      var shown = 0;
      var target = 0;
      var last = performance.now();
      var finishing = null;
      var safety = setTimeout(function () { finish().then(hide); }, 30000);

      // Scrolling waits for the city: nothing moves under the loader.
      var block = function (e) { e.preventDefault(); e.stopImmediatePropagation(); };
      var keys = function (e) { if ([' ', 'ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', 'End', 'Home'].indexOf(e.key) > -1) e.preventDefault(); };
      addEventListener('wheel', block, { passive: false, capture: true });
      addEventListener('touchmove', block, { passive: false, capture: true });
      addEventListener('keydown', keys, true);

      var tick = function (now) {
        var dt = Math.min(0.1, (now - last) / 1000);
        last = now;
        var goal = finishing ? 1 : Math.min(target, 0.96);
        shown += (goal - shown) * (1 - Math.exp(-dt * (finishing ? 30 : 6)));
        pct.textContent = Math.round(shown * 100) + '%';
        if (finishing && shown > 0.995) { finishing(); return; }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);

      function finish() {
        return new Promise(function (resolve) {
          var done = false;
          finishing = function () { if (!done) { done = true; pct.textContent = '100%'; resolve(); } };
          // A hidden tab never paints, so don't wait on it.
          setTimeout(finishing, 350);
        });
      }
      function hide() {
        clearTimeout(safety);
        removeEventListener('wheel', block, { capture: true });
        removeEventListener('touchmove', block, { capture: true });
        removeEventListener('keydown', keys, true);
        root.classList.remove('is-loading');
        loader.classList.add('is-done');
        setTimeout(function () { loader.remove(); }, 500);
      }
      window.__loader = {
        set: function (p) { target = Math.max(target, Math.min(0.96, p)); },
        finish: finish,
        hide: hide,
      };
    })();
  </script>
  <svg id="fx-defs" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- Line boil: the turbulence seed changes a few times a second so drawn lines breathe -->
      <filter id="boil" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="1" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- Paper cutout: a thick paper edge and a hard offset shadow, like a pop-up book -->
      <filter id="cutout" x="-20%" y="-20%" width="140%" height="140%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="fat"/>
        <feFlood flood-color="#F1EDE3" result="paperFill"/>
        <feComposite in="paperFill" in2="fat" operator="in" result="edge"/>
        <feOffset in="fat" dx="6" dy="7" result="offset"/>
        <feFlood flood-color="#000" flood-opacity=".38"/>
        <feComposite in2="offset" operator="in" result="shadow"/>
        <feMerge><feMergeNode in="shadow"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <pattern id="ht-ink" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.25" fill="#0E0D0B"/></pattern>
      <pattern id="ht-ink-fine" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><circle cx="1.75" cy="1.75" r=".8" fill="#0E0D0B"/></pattern>
      <pattern id="ht-paper" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.25" fill="#F1EDE3"/></pattern>
      <pattern id="hatch-ink" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#0E0D0B" stroke-width="1.3"/></pattern>
      <pattern id="hatch-paper" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#F1EDE3" stroke-width="1.3"/></pattern>
    </defs>
  </svg>
